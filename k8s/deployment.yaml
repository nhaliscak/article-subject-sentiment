apiVersion: apps/v1
kind: Deployment
metadata:
  name: article-subject-sentiment
  labels:
    app: article-subject-sentiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: article-subject-sentiment
  template:
    metadata:
      labels:
        app: article-subject-sentiment
    spec:
      containers:
        - name: article-subject-sentiment
          # Registry path confirmed 2026-09-28 to match the exact convention every other
          # image on this cluster uses (kubectl get deploy -o jsonpath=... across the
          # tradebot namespace) - .github/workflows/build-and-deploy.yml bumps this tag.
          image: ghcr.io/nhaliscak/article-subject-sentiment:26150baa8c0f4cb1c46f797ab52d0db13fe96838
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
