# Mirrors tradebot_hub's proven workflow (github.com/nhaliscak/tradebot_hub/.github/workflows/
# build-and-deploy.yml) exactly: on every push to main, build a multi-arch image (linux/amd64 +
# linux/arm64, for the Turing Pi RK1 nodes) via QEMU+buildx, push it to GHCR tagged with the
# commit SHA, then bump k8s/deployment.yaml's image line and push that as a second, automated
# [skip ci] commit - which Argo CD (k8s/argocd-application.yaml's automated.selfHeal) picks up.
#
# pull_request builds (both platforms) as a merge-blocking check but never pushes anything -
# this is also where a from-source aarch64 build of spacy/numpy/blis (if wheels are missing for
# the pinned versions - see Dockerfile's build-essential comment) would actually get exercised
# for the first time, since this repo's own build has only ever run on x86_64 until now.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/article-subject-sentiment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump the deployed image tag
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" k8s/deployment.yaml

      - name: Commit and push the deploy bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet k8s/deployment.yaml; then
            echo "image tag unchanged, nothing to deploy"
            exit 0
          fi
          git add k8s/deployment.yaml
          git commit -m "Deploy ${GITHUB_SHA::7} [skip ci]"
          git push
